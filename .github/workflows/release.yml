name: Build Blind Soldier release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version used for a verification-only package build
        required: true
        default: "0.1.4"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install .NET 8 and 9 SDKs (x64)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
          architecture: x64

      - name: Install .NET 8 and 9 SDKs (x86)
        uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}\dotnet-x86
        with:
          dotnet-version: |
            8.0.x
            9.0.x
          architecture: x86

      - name: Install Java 21 for Ghidra
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build and validate release assets
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\dotnet;$env:PATH"
          $env:DOTNET_ROOT = 'C:\Program Files\dotnet'
          $env:DOTNET_ROOT_X64 = 'C:\Program Files\dotnet'
          $env:DOTNET_ROOT_X86 = "$env:RUNNER_TEMP\dotnet-x86"
          ./Run-DualRuntimeVerification.ps1
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME.Substring(1)
          } else {
            '${{ inputs.version }}'
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'A package version is required.'
          }
          New-Item -ItemType Directory -Path ./artifacts/release -Force | Out-Null
          ./Build-BlindSoldierPortablePackage.ps1 -OutputPath ./artifacts/release/Blind-Soldier-Portable.zip -Version $version
          ./Verify-BlindSoldierPortablePackage.ps1 -ArchivePath ./artifacts/release/Blind-Soldier-Portable.zip -ExpectedVersion $version

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; verified assets were not overwritten."
            exit 0
          }
          $version = $tag.Substring(1)
          $arguments = @('release', 'create', $tag, '--repo', $env:GITHUB_REPOSITORY, '--title', "Blind Soldier $version", '--notes-file', './docs/releases/v0.1.4.md')
          if ($version.Contains('-')) { $arguments += '--prerelease' }
          $arguments += @('./artifacts/release/Blind-Soldier-Portable.zip', './artifacts/release/Blind-Soldier-Portable.zip.sha256')
          gh @arguments
