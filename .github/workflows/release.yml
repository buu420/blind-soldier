name: Build Blind Soldier release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version used for a verification-only package build
        required: true
        default: "0.4.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install .NET 8 and 9 SDKs (x64)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
          architecture: x64

      - name: Install .NET 8 and 9 SDKs (x86)
        uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}\dotnet-x86
        with:
          dotnet-version: |
            8.0.x
            9.0.x
          architecture: x86

      - name: Install Java 21 for Ghidra
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pinned Pester 4 test runtime
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force -Confirm:$false | Out-Null
          Install-Module -Name Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber
          Import-Module Pester -RequiredVersion 4.10.1 -Force
          if ((Get-Module Pester).Version -ne [version]'4.10.1') {
            throw 'Pester 4.10.1 was not activated for release verification.'
          }
          $contract = Invoke-Pester -Script ./.github/workflows/release.Tests.ps1 -PassThru
          if ($contract.FailedCount -ne 0) {
            throw 'The release workflow evidence-binding contract failed.'
          }

      - name: Build and validate release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $x86DotNetRoot = $env:DOTNET_ROOT
          if (-not (Test-Path -LiteralPath "$x86DotNetRoot\dotnet.exe" -PathType Leaf)) {
            throw "The x86 .NET host is unavailable: $x86DotNetRoot"
          }
          $env:PATH = "C:\Program Files\dotnet;$env:PATH"
          $env:DOTNET_ROOT = 'C:\Program Files\dotnet'
          $env:DOTNET_ROOT_X64 = 'C:\Program Files\dotnet'
          $env:DOTNET_ROOT_X86 = $x86DotNetRoot
          ./Run-DualRuntimeVerification.ps1
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME.Substring(1)
          } else {
            '${{ inputs.version }}'
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'A package version is required.'
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            # Only on a real release. A workflow_dispatch build names its own
            # version for verification and is not what anyone downloads, so a
            # README that disagrees with it is not a fault.
            ./Verify-BlindSoldierReadmeLinks.ps1 -ExpectedVersion $version
          }
          New-Item -ItemType Directory -Path ./artifacts/release -Force | Out-Null
          ./Build-BlindSoldierPortablePackage.ps1 -OutputPath ./artifacts/release/Blind-Soldier-Portable.zip -Version $version
          ./Verify-BlindSoldierPortablePackage.ps1 -ArchivePath ./artifacts/release/Blind-Soldier-Portable.zip -ExpectedVersion $version
          ./tools/Invoke-BlindSoldierGhidraVerification.ps1 -ArchivePath ./artifacts/release/Blind-Soldier-Portable.zip
          ./Build-BlindSoldier2013PortablePackage.ps1 -SourceArchivePath ./artifacts/release/Blind-Soldier-Portable.zip -OutputPath ./artifacts/release/Blind-Soldier-2013-x86-Portable.zip -Version $version
          ./Verify-BlindSoldier2013PortablePackage.ps1 -ArchivePath ./artifacts/release/Blind-Soldier-2013-x86-Portable.zip -ExpectedVersion $version -ExpectedSourceArchivePath ./artifacts/release/Blind-Soldier-Portable.zip

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; verified assets were not overwritten."
            exit 0
          }
          $version = $tag.Substring(1)
          $releaseTrack = ./tools/Resolve-BlindSoldierReleaseTrack.ps1 -Version $version
          $notesPath = "./docs/releases/$tag.md"
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) {
            throw "Release notes are missing: $notesPath"
          }
          $arguments = @('release', 'create', $tag, '--repo', $env:GITHUB_REPOSITORY, '--title', "Blind Soldier $version", '--notes-file', $notesPath)
          if ($releaseTrack -eq 'prerelease') { $arguments += '--prerelease' }
          $arguments += @(
            './artifacts/release/Blind-Soldier-Portable.zip',
            './artifacts/release/Blind-Soldier-Portable.zip.sha256',
            './artifacts/release/Blind-Soldier-2013-x86-Portable.zip',
            './artifacts/release/Blind-Soldier-2013-x86-Portable.zip.sha256'
          )
          gh @arguments
