name: Build Blind Soldier release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install Java 21 for Ghidra
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build and validate release assets
        shell: pwsh
        run: |
          ./Run-DualRuntimeVerification.ps1
          $version = $env:GITHUB_REF_NAME.Substring(1)
          New-Item -ItemType Directory -Path ./artifacts/release -Force | Out-Null
          ./Build-BlindSoldierPortablePackage.ps1 -OutputPath ./artifacts/release/Blind-Soldier-Portable.zip -Version $version
          ./Verify-BlindSoldierPortablePackage.ps1 -ArchivePath ./artifacts/release/Blind-Soldier-Portable.zip -ExpectedVersion $version

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; verified assets were not overwritten."
            exit 0
          }
          $version = $tag.Substring(1)
          $arguments = @('release', 'create', $tag, '--repo', $env:GITHUB_REPOSITORY, '--title', "Blind Soldier $version", '--notes-file', './docs/releases/v0.1.4.md')
          if ($version.Contains('-')) { $arguments += '--prerelease' }
          $arguments += @('./artifacts/release/Blind-Soldier-Portable.zip', './artifacts/release/Blind-Soldier-Portable.zip.sha256')
          gh @arguments
